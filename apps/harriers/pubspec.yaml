name: harriers
description: Kidderminster Harriers — Touchline Club App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Touchline packages
  api_client:
    path: ../../packages/api_client
  core_ui:
    path: ../../packages/core_ui
  theming:
    path: ../../packages/theming
  feature_auth:
    path: ../../packages/feature_auth
  feature_match_centre:
    path: ../../packages/feature_match_centre
  feature_player:
    path: ../../packages/feature_player
  feature_predictor:
    path: ../../packages/feature_predictor
  feature_news:
    path: ../../packages/feature_news
  feature_shop:
    path: ../../packages/feature_shop
  feature_events:
    path: ../../packages/feature_events
  feature_programmes:
    path: ../../packages/feature_programmes
  feature_league:
    path: ../../packages/feature_league

  # Navigation
  go_router: 12.1.3

  # State
  flutter_riverpod: ^2.6.1

  # UI (used directly in apps/harriers — e.g. NavbarWidget)
  flutter_spinkit: 5.2.0
  lottie: 3.1.2
  font_awesome_flutter: 10.7.0

  # Splash screen
  flutter_native_splash: 2.4.1

dev_dependencies:
  flutter_launcher_icons: 0.13.1
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  web:
    generate: true
  image_path: 'assets/images/app_launcher_icon.png'
  adaptive_icon_background: '#00ffffff'
  adaptive_icon_foreground: 'assets/images/adaptive_foreground_icon.png'

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/jsons/

  fonts:
    - family: IcomoonBuck1
      fonts:
        - asset: assets/fonts/icomoon-buck1.ttf
    - family: TwitterFont
      fonts:
        - asset: assets/fonts/twitterFont.ttf
    - family: Icomoon
      fonts:
        - asset: assets/fonts/icomoon.ttf
