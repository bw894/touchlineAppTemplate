name: club_app_template
# TODO(new-club): rename to match the club, e.g. harriers
description: Touchline club app template — copy to apps/[clubname]/ and fill in AppConfig.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Internal packages — all provided by the monorepo
  api_client:
    path: ../../packages/api_client
  core_ui:
    path: ../../packages/core_ui
  theming:
    path: ../../packages/theming
  feature_auth:
    path: ../../packages/feature_auth
  feature_match_centre:
    path: ../../packages/feature_match_centre
  feature_league:
    path: ../../packages/feature_league
  feature_player:
    path: ../../packages/feature_player
  feature_predictor:
    path: ../../packages/feature_predictor
  feature_news:
    path: ../../packages/feature_news
  feature_shop:
    path: ../../packages/feature_shop
  feature_events:
    path: ../../packages/feature_events
  feature_programmes:
    path: ../../packages/feature_programmes

  # Navigation
  go_router: 12.1.3

  # State
  flutter_riverpod: ^2.6.1

  # Firebase — analytics, crashlytics, messaging, remote config.
  # User auth (firebase_auth) lives inside feature_auth.
  firebase_core: 3.14.0
  firebase_analytics: 11.5.0
  firebase_crashlytics: 4.3.7
  firebase_messaging: 15.2.7
  firebase_remote_config: 5.4.5

  # Deep links
  dynalink_flutter: ^0.0.11

  # WebView — TicketsScreen + PayForParking (via feature_events)
  webview_flutter: 4.13.0

  # UI helpers used by NavbarWidget / HomeScreen
  flutter_spinkit: 5.2.0
  font_awesome_flutter: 10.7.0
  lottie: 3.1.2

dev_dependencies:
  flutter_launcher_icons: 0.13.1
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/images/app_launcher_icon.png'
  # TODO(new-club): add adaptive_icon_foreground + adaptive_icon_background

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/jsons/
    # TODO(new-club): add any extra asset directories here

  fonts:
    # TODO(new-club): replace with the club's font files.
    # The fontFamily string must match ClubThemeConfig.fontFamily in app_config.dart.
    - family: TwitterFont
      fonts:
        - asset: assets/fonts/twitterFont.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
