name: feature_auth
description: Touchline authentication, user session management, CRM integration, and account screens.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Internal
  api_client:
    path: ../api_client
  core_ui:
    path: ../core_ui
  theming:
    path: ../theming

  # State
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: 12.1.3

  # Firebase auth
  firebase_auth: 5.6.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.1

  # HTTP (JWT exchange)
  http: 1.4.0

  # Persistence
  csv: 6.0.0
  flutter_secure_storage: 10.0.0-beta.4
  shared_preferences: 2.5.3

  # UI
  font_awesome_flutter: 10.7.0
  google_fonts: 6.3.3

  # Utils
  collection: 1.19.1

dev_dependencies:
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter
