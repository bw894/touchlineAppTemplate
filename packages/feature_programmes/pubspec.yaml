name: feature_programmes
description: Touchline digital programmes — programme listing and match programme viewer.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Internal
  api_client:
    path: ../api_client
  core_ui:
    path: ../core_ui
  theming:
    path: ../theming

  # State
  flutter_riverpod: ^2.6.1

  # Content rendering
  cached_network_image: 3.4.1
  flutter_spinkit: 5.2.0
  font_awesome_flutter: 10.7.0
  webview_flutter: 4.13.0

  # Utils
  collection: 1.19.1
  intl: any

dev_dependencies:
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter
