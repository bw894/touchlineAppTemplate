name: core_ui
description: Shared Touchline UI components, AppConfig interface, component variant enums, and utility extensions.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Internal
  theming:
    path: ../theming

  # State
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: 12.1.3

  # UI
  auto_size_text: 3.0.0
  cached_network_image: 3.4.1
  flutter_animate: 4.5.0
  flutter_spinkit: 5.2.0
  flutter_svg: 2.1.0
  font_awesome_flutter: 10.7.0
  google_fonts: 6.3.3
  lottie: 3.1.2
  percent_indicator: 4.2.2
  photo_view: 0.15.0
  smooth_page_indicator: 1.1.0
  webview_flutter: 4.13.0

  # Utils
  collection: 1.19.1
  dropdown_button2: 2.3.9
  equatable: 2.0.7
  intl: 0.20.2
  rxdart: ^0.28.0
  timeago: 3.7.1
  url_launcher: 6.3.1

dev_dependencies:
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter
