name: feature_events
description: Touchline events — team events, RSVP, parking, interactive hub, and youth features.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Internal
  api_client:
    path: ../api_client
  core_ui:
    path: ../core_ui
  theming:
    path: ../theming

  # State
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: 12.1.3

  # UI
  cached_network_image: 3.4.1
  flutter_animate: 4.5.0
  flutter_spinkit: 5.2.0
  font_awesome_flutter: 10.7.0
  percent_indicator: 4.2.2
  webview_flutter: 4.13.0

  # Utils
  collection: 1.19.1
  intl: any
  url_launcher: 6.3.1

dev_dependencies:
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter
