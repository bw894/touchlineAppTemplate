name: feature_news
description: Touchline news — WordPress feed, CMS content, X (Twitter) feed, videos, and HTML content.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Internal
  api_client:
    path: ../api_client
  core_ui:
    path: ../core_ui
  theming:
    path: ../theming

  # State
  flutter_riverpod: ^2.6.1

  # Media
  cached_network_image: 3.4.1
  flutter_html: ^3.0.0-beta.2
  flutter_widget_from_html: ^0.16.0
  lottie: 3.1.2
  video_player: 2.10.0
  webview_flutter: 4.13.0
  youtube_player_iframe: ^5.1.0

  # Spinners / icons
  flutter_spinkit: 5.2.0
  font_awesome_flutter: 10.7.0

  # Utils
  collection: 1.19.1
  html_unescape: ^2.0.0
  intl: any
  timeago: 3.7.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter
