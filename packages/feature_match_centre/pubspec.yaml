name: feature_match_centre
description: Touchline match centre — fixtures, results, live text, stats, and next fixture sliders.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Internal
  api_client:
    path: ../api_client
  core_ui:
    path: ../core_ui
  theming:
    path: ../theming
  feature_auth:
    path: ../feature_auth
  feature_league:
    path: ../feature_league
  feature_player:
    path: ../feature_player
  feature_predictor:
    path: ../feature_predictor

  # State
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: 12.1.3

  # UI
  lottie: 3.1.2
  smooth_page_indicator: 1.1.0
  flutter_animate: 4.5.0
  aligned_tooltip: 0.0.1
  auto_size_text: 3.0.0
  font_awesome_flutter: 10.7.0

  # Utils
  collection: 1.19.1
  intl: 0.20.2

dev_dependencies:
  flutter_lints: 4.0.0
  flutter_test:
    sdk: flutter
