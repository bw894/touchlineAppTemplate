include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    missing_required_param: error
    missing_return: error
    dead_code: warning
    unused_import: warning
    unused_local_variable: warning
  exclude:
    # Legacy FlutterFlow code — excluded until each phase migrates it out
    - lib/flutter_flow/**
    - lib/custom_code/**
    - lib/flutter_flow/custom_functions.dart
    - lib/backend/schema/structs/**
    - lib/backend/api_requests/**

linter:
  rules:
    # Style — enforce in new packages only (legacy lib/ excluded above)
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    unnecessary_const: true
    unnecessary_new: true
    avoid_unnecessary_containers: true
    sized_box_for_whitespace: true

    # Safety
    avoid_print: true
    use_build_context_synchronously: true
    always_use_package_imports: true
